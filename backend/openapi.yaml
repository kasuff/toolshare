openapi: 3.1.0
info:
  version: 0.1.0
  title: ToolShare API
  description: REST API contract for ToolShare (auth, tools, bookings, workshops,
    users, ratings, moderation, notifications, system-rules & address). Response
    payloads are derived from the shared Zod response contracts (ADR-013).
servers:
  - url: http://localhost:4000/api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ToolResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        category:
          type: string
        imageUrl:
          type:
            - string
            - "null"
        pickupLocation:
          type:
            - string
            - "null"
        pickupLocationNote:
          type:
            - string
            - "null"
        status:
          type: string
          enum: &a1
            - AVAILABLE
            - REQUESTED
            - BORROWED
        createdAt:
          type: string
        updatedAt:
          type: string
        owner:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            role:
              type: string
              enum: &a2
                - USER
                - MODERATOR
                - MANAGER
            isSuspended:
              type: boolean
          required:
            - id
            - name
            - role
            - isSuspended
        bookings:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              startDate:
                type: string
              endDate:
                type: string
              status:
                type: string
                enum: &a3
                  - PENDING
                  - ACCEPTED
                  - REJECTED
                  - RETURNED
            required:
              - id
              - startDate
              - endDate
              - status
      required:
        - id
        - ownerId
        - name
        - description
        - category
        - imageUrl
        - pickupLocation
        - pickupLocationNote
        - status
        - createdAt
        - updatedAt
        - owner
    ToolListResponse:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            format: uuid
