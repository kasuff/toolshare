    - cp backend-lint-report.html public/ || true
    - cp mobile-lint-report.html public/ || true
    - cp trivy-report.txt public/ || true
    - cp gl-sast-report.json public/ || true
    - cp sast-report.txt public/ || true
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        PAGES_PREFIX: "mr-$CI_MERGE_REQUEST_IID"
        PAGES_URL: "$CI_PAGES_URL/mr-$CI_MERGE_REQUEST_IID/"
        PAGES_ENV_NAME: "pages/mr-$CI_MERGE_REQUEST_IID"
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        PAGES_PREFIX: ""
        PAGES_URL: "$CI_PAGES_URL/"
        PAGES_ENV_NAME: "pages/main"
  pages:
    expire_in: never
    path_prefix: "$PAGES_PREFIX"
  environment:
    name: $PAGES_ENV_NAME
    url: $PAGES_URL
    action: start

# === CODE QUALITY & COMPLIANCE ===

security:audit:
  stage: test
  image: node:20.19   # pinned: node:20 drifted to v20.20.2 whose x64 V8 JIT crashes
  allow_failure: true
  script:
    - (cd backend && npm audit --audit-level=moderate)
    - (cd frontend && npm audit --workspaces=false --audit-level=moderate)
    - (cd mobile && npm audit --workspaces=false --audit-level=high)

semgrep-sast:
  stage: test
  image: semgrep/semgrep:latest
  script:
    # The semgrep image expects code at /src; GitLab checks it out to
    # $CI_PROJECT_DIR (/builds/...). Without an explicit target, newer semgrep
    # versions abort with "Detected Docker environment without a code volume"
    # instead of scanning the working dir. Pass the checkout dir explicitly.
    - SCAN_TARGET="${CI_PROJECT_DIR:-.}"
    # Full scan incl. monitoring/ (the dora-exporter is our own Python code).
    # First two commands only produce the report artifacts and never fail the
    # job; the final command gates the pipeline on ERROR-severity findings.
    - semgrep scan --config=auto --gitlab-sast -o gl-sast-report.json "$SCAN_TARGET" || true
    - echo "=== Semgrep SAST Security Report ===" > sast-report.txt
    - echo "====================================" >> sast-report.txt
    - echo "" >> sast-report.txt
    - semgrep scan --config=auto --text "$SCAN_TARGET" >> sast-report.txt || true
    # Gate: fail the pipeline on high-confidence ERROR-severity findings.
    - semgrep scan --config=auto --severity ERROR --error "$SCAN_TARGET"
  artifacts:
    paths:
      - gl-sast-report.json
      - sast-report.txt
    reports:
      sast: gl-sast-report.json
    when: always

security:container:trivy:
  stage: test
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    # Full scan incl. monitoring/ (the dora-exporter is our own image/code).
    # First command writes the HIGH+CRITICAL report and never fails the job;
    # the second gates the pipeline on CRITICAL findings only.
    - trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --format table -o trivy-report.txt . || true
    - trivy fs --scanners vuln,secret,misconfig --severity CRITICAL --exit-code 1 .
  artifacts:
    when: always
    paths:
      - trivy-report.txt
# - Alle Pipelines-Jobs müssen erfolgreich sein
# - Push-Protektion auf main-Branch
