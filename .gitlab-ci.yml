stages:
  - lint
  - test


variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  NODE_ENV: "test"

# === FRONTEND JOBS ===

frontend:lint:
  stage: lint
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - npm run lint
  only:
    - merge_requests
    - main
    - /^feature\/.*$/
  cache:
    paths:
      - frontend/node_modules/

frontend:test:
  stage: test
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - npm run test
  only:
    - merge_requests
    - main
    - /^feature\/.*$/
  coverage: '/Coverage: \d+\.\d+%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml
      junit: frontend/junit.xml
    paths:
      - frontend/coverage/
    expire_in: 1 week
  cache:
    paths:
      - frontend/node_modules/


# === BACKEND JOBS ===

backend:lint:
  stage: lint
  image: node:20
  script:
    - cd backend
    - npm ci
    - npm run lint
  only:
    - merge_requests
    - main
    - /^feature\/.*$/
  cache:
    paths:
      - backend/node_modules/

backend:test:
  stage: test
  image: node:20
  services:
    - postgres:15
  variables:
    POSTGRES_DB: toolshare_test
    POSTGRES_USER: toolshare
    POSTGRES_PASSWORD: testpass
    POSTGRES_HOST_AUTH_METHOD: trust
    DATABASE_URL: "postgresql://toolshare:testpass@postgres:5432/toolshare_test"
  script:
    - cd backend
    - npm ci
    - npx prisma db push
    - npm run test -- --coverage
  only:
    - merge_requests
    - main
    - /^feature\/.*$/
  coverage: '/All files\s+\|\s+(\d+\.\d+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage/cobertura-coverage.xml
      junit: backend/junit.xml
    paths:
      - backend/coverage/
    expire_in: 1 week
  cache:
    paths:
      - backend/node_modules/



# === CODE QUALITY & COMPLIANCE ===

security:scan:
  stage: test
  image: node:20
  allow_failure: true
  script:
    - npm install -g npm-audit
    - cd backend && npm audit --audit-level=moderate && cd ..
    - cd frontend && npm audit --audit-level=moderate && cd ..
  only:
    - merge_requests
    - main

# === MERGE REQUEST RULES ===
# Konfiguration in GitLab UI:
# - Mindestens 1 Approval erforderlich
# - Alle Pipelines-Jobs müssen erfolgreich sein
# - Push-Protektion auf main-Branch
