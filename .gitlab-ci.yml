stages:
  - lint
  - test
  - build
  - pages


variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  NODE_ENV: "test"

# === FRONTEND JOBS ===

frontend:lint:
  stage: lint
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - npm run lint -- -f html -o ../frontend-lint-report.html || true
    - npm run lint
  only:
    - merge_requests
    - main
    - /^feature\/.*$/
  artifacts:
    when: always
    paths:
      - frontend-lint-report.html
  cache:
    paths:
      - frontend/node_modules/

frontend:test:
  stage: test
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - npm run test
  only:
    - merge_requests
    - main
    - /^feature\/.*$/
  coverage: '/Coverage: \d+\.\d+%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml
      junit: frontend/junit.xml
    paths:
      - frontend/coverage/
    expire_in: 1 week
  cache:
    paths:
      - frontend/node_modules/


# === BACKEND JOBS ===

backend:lint:
  stage: lint
  image: node:20
  script:
    - cd backend
    - npm ci
    - npm run lint -- -f html -o ../backend-lint-report.html || true
    - npm run lint
  only:
    - merge_requests
    - main
    - /^feature\/.*$/
  artifacts:
    when: always
    paths:
      - backend-lint-report.html
  cache:
    paths:
      - backend/node_modules/

backend:test:
  stage: test
  image: node:20
  services:
    - postgres:15
  variables:
    POSTGRES_DB: toolshare_test
    POSTGRES_USER: toolshare
    POSTGRES_PASSWORD: testpass
    POSTGRES_HOST_AUTH_METHOD: trust
    DATABASE_URL: "postgresql://toolshare:testpass@postgres:5432/toolshare_test"
  script:
    - cd backend
    - npm ci
    - npx prisma db push
    - npm run test -- --coverage
  only:
    - merge_requests
    - main
    - /^feature\/.*$/
  coverage: '/All files\s+\|\s+(\d+\.\d+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage/cobertura-coverage.xml
      junit: backend/junit.xml
    paths:
      - backend/coverage/
    expire_in: 1 week
  cache:
    paths:
      - backend/node_modules/

# === BUILD JOBS ===

frontend:build:
  stage: build
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build
  only:
    - merge_requests
    - main
    - /^feature\/.*$/
  cache:
    paths:
      - frontend/node_modules/

backend:build:
  stage: build
  image: node:20
  script:
    - cd backend
    - npm ci
    - npm run build
  only:
    - merge_requests
    - main
    - /^feature\/.*$/
  cache:
    paths:
      - backend/node_modules/

# === PAGES JOB ===

pages:
  stage: pages
  image: alpine:latest
  needs:
    - frontend:lint
    - frontend:test
    - backend:lint
    - backend:test

  script:
    - apk add --no-cache bash
    - mkdir public
    - |
      cat <<EOF > public/index.html
      <!DOCTYPE html>
      <html lang="de">
      <head>
          <meta charset="UTF-8">
          <title>ToolShare CI Metriken</title>
          <style>
              body { font-family: sans-serif; padding: 2rem; background: #f4f4f9; }
              .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
              a { display: block; margin: 5px 0; color: #007bff; text-decoration: none; }
          </style>
      </head>
      <body>
          <h1>ToolShare Dashboard</h1>
          <div class="card">
              <h2>Frontend</h2>
              <a href="frontend-coverage/index.html">Test Coverage</a>
              <a href="frontend-lint-report.html">Linting Report</a>
          </div>
          <div class="card">
              <h2>Backend</h2>
              <a href="backend-coverage/index.html">Test Coverage</a>
              <a href="backend-lint-report.html">Linting Report</a>
          </div>
      </body>
      </html>
      EOF
    - cp -r frontend/coverage public/frontend-coverage || true
    - cp -r backend/coverage public/backend-coverage || true
    - cp frontend-lint-report.html public/ || true
    - cp backend-lint-report.html public/ || true
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        PAGES_PREFIX: "mr-$CI_MERGE_REQUEST_IID"
        PAGES_URL: "$CI_PAGES_URL/mr-$CI_MERGE_REQUEST_IID/"
        PAGES_ENV_NAME: "pages/mr-$CI_MERGE_REQUEST_IID"
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        PAGES_PREFIX: ""
        PAGES_URL: "$CI_PAGES_URL/"
        PAGES_ENV_NAME: "pages/main"
  pages:
    path_prefix: "$PAGES_PREFIX"
  environment:
    name: $PAGES_ENV_NAME
    url: $PAGES_URL
    action: start

# === CODE QUALITY & COMPLIANCE ===

security:scan:
  stage: test
  image: node:20
  allow_failure: true
  script:
    - (cd backend && npm audit --audit-level=moderate)
    - (cd frontend && npm audit --audit-level=moderate)
  only:
    - merge_requests
    - main

# === MERGE REQUEST RULES ===
# Konfiguration in GitLab UI:
# - Mindestens 1 Approval erforderlich
# - Alle Pipelines-Jobs müssen erfolgreich sein
# - Push-Protektion auf main-Branch
