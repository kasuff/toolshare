stages:
  - lint
  - test
  - build
  - deploy
  - pages


variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  NODE_ENV: "test"
  # --- Performance / robustness tuning ---
  GIT_DEPTH: "20"                  # shallow clones -> faster checkouts
  FF_USE_FASTZIP: "true"           # faster cache (de)compression
  CACHE_COMPRESSION_LEVEL: "fast"
  TRANSFER_METER_FREQUENCY: "5s"
  NPM_CONFIG_AUDIT: "false"        # skip the audit pass on every install
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_PROGRESS: "false"

# Applied to every job unless overridden: auto-cancel superseded pipelines
# and transparently retry transient infrastructure failures -- the
# "red once, green on re-run" class of errors.
default:
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure
      - api_failure
      - scheduler_failure
      - data_integrity_failure

# Run pipelines only for merge requests and the default branch, and never
# run a redundant branch-pipeline next to an MR pipeline (saves ~half the
# compute on branches that have an open MR).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# npm's download cache, keyed by the lockfile. node_modules itself is NOT
# cached on purpose: `npm ci` deletes it on every run, so caching it buys
# nothing -- caching the tarball store and using `--prefer-offline` does.
.frontend_cache:
  cache:
    key:
      files:
        - frontend/package-lock.json
      prefix: frontend-npm
    paths:
      - frontend/.npm/
    policy: pull

.backend_cache:
  cache:
    key:
      files:
        - backend/package-lock.json
      prefix: backend-npm
    paths:
      - backend/.npm/
    policy: pull

.mobile_cache:
  cache:
    key:
      files:
        - mobile/package-lock.json
      prefix: mobile-npm
    paths:
      - mobile/.npm/
    policy: pull

# The Expo dependency tree carries peer-dependency conflicts (React 19 vs.
# packages that still pin React 18-era peers), so the mobile install needs
# --legacy-peer-deps. Factored out so lint and test stay in sync.
.mobile_install:
  script:
    - cd mobile
    # npm ci occasionally fails on a corrupted registry response cached in
    # .npm ("invalid json response body ... Bad control character"). Retry up
    # to 3x; from the 2nd attempt on, purge the content-addressable cache so a
    # poisoned metadata blob can't fail every run identically.
    - |
      ok=0
      for attempt in 1 2 3; do
        if [ "$attempt" -eq 1 ]; then
          flags="--prefer-offline"
        else
          echo "Purging npm cache before retry $attempt"
          rm -rf .npm/_cacache
          flags=""
        fi
        if npm ci --workspaces=false --legacy-peer-deps --cache .npm $flags; then
          ok=1
          break
        fi
        echo "npm ci failed (attempt $attempt) -- retrying in 3s"
        sleep 3
      done
      [ "$ok" -eq 1 ]

# Block until the Postgres service actually accepts TCP connections before
# touching it. Removes the race where `prisma db push` runs before the DB
# is up -- the main cause of flaky backend:test runs.
.pg_wait:
  script:
    - |
      echo "Waiting for Postgres to accept connections..."
      node -e '
        const net = require("net");
        const host = "postgres", port = 5432, deadline = Date.now() + 60000;
        (function probe() {
          const sock = net.connect(port, host);
          sock.setTimeout(2000);
          const retry = (e) => {
            sock.destroy();
            if (Date.now() > deadline) { console.error("Postgres not ready:", e && e.message); process.exit(1); }
            setTimeout(probe, 1500);
          };
          sock.on("connect", () => { sock.end(); console.log("Postgres is ready."); process.exit(0); });
          sock.on("error", retry);
          sock.on("timeout", () => retry(new Error("timeout")));
        })();
      '

# `npm ci` occasionally segfaults (exit 139) on shared runners -- the V8 JIT
# miscompiles, most often while `prisma generate` runs in the backend
# postinstall hook. The same command passes on a re-run, so retry up to 3x
# before failing the pipeline. Assumes the working directory is already the
# package dir (the job must `cd` into it first).
.npm_ci:
  script:
    - |
      ok=0
      for attempt in 1 2 3; do
        if npm ci --workspaces=false --prefer-offline --cache .npm; then
          ok=1
          break
        fi
        echo "npm ci failed (attempt $attempt) -- retrying in 3s"
        sleep 3
      done
      [ "$ok" -eq 1 ]

# === FRONTEND JOBS ===

frontend:lint:
  stage: lint
  image: node:20.19-slim
  extends: .frontend_cache
  cache:
    policy: pull-push   # lint runs first -> it seeds the shared npm cache
  script:
    - cd frontend
    - npm ci --workspaces=false --prefer-offline --cache .npm
    - npm run lint -- -f html -o ../frontend-lint-report.html || true
    - npm run lint
  artifacts:
    when: always
    paths:
      - frontend-lint-report.html

frontend:test:
  stage: test
  # glibc (debian) -> avoids intermittent musl/jsdom fork crashes; pinned to
  # 20.19 because node:20 drifted to v20.20.2, whose x64 V8 JIT miscompiles and
  # core-dumps workers ("Illegal instruction" in Runtime_CompileOptimized).
  image: node:20.19-slim
  extends: .frontend_cache
  # V8 coverage on shared runners can stall for several minutes under load; 15m was too tight.
  timeout: 30m
  variables:
    NODE_OPTIONS: "--max-old-space-size=4096"   # headroom so the test fork is not OOM-killed
  script:
    - cd frontend
    - npm ci --workspaces=false --prefer-offline --cache .npm
    # Vitest occasionally segfaults (exit 139) on shared runners when V8 coverage
    # instrumentation runs under load -- retry before failing the pipeline.
    - |
      ok=0
      for attempt in 1 2 3; do
        if npm run test -- --coverage; then
          ok=1
          break
        fi
        code=$?
        if [ "$attempt" -eq 3 ] || [ "$code" -ne 139 ]; then
          exit "$code"
        fi
        echo "vitest segfaulted (exit $code) -- retrying in 3s (attempt $attempt)"
        sleep 3
      done
      [ "$ok" -eq 1 ]
    - node ../scripts/check-coverage.js coverage
  coverage: '/Coverage: \d+\.\d+%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml
      junit: frontend/junit.xml
    paths:
      - frontend/coverage/
    expire_in: 1 week

frontend:accessibility:
  stage: test
  image: node:20.19-slim
  extends: .frontend_cache
  timeout: 15m
  variables:
    CHROME_PATH: "/usr/bin/chromium"
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends chromium
    - rm -rf /var/lib/apt/lists/*
  script:
    - cd frontend
    - npm ci --workspaces=false --prefer-offline --cache .npm
    - npm run build
    - npm run test:a11y
    - npm run lighthouse
  artifacts:
    when: always
    paths:
      - frontend/lighthouse-results/
    expire_in: 1 week


# === BACKEND JOBS ===

backend:lint:
  stage: lint
  image: node:20.19   # pinned: node:20 drifted to v20.20.2 whose x64 V8 JIT crashes
  extends: .backend_cache
  cache:
    policy: pull-push   # lint runs first -> it seeds the shared npm cache
  script:
    - cd backend
    - npm ci --workspaces=false --prefer-offline --cache .npm
    - npm run lint -- -f html -o ../backend-lint-report.html || true
    - npm run lint
  artifacts:
    when: always
    paths:
      - backend-lint-report.html

backend:architecture:
  stage: test
  image: node:20.19
  extends: .backend_cache
  script:
    - cd backend
    - !reference [.npm_ci, script]
    - npx vitest run tests/architecture.test.ts

backend:contracts:
  stage: test
  image: node:20.19
  extends: .backend_cache
  script:
    - cd backend
    - !reference [.npm_ci, script]
    - npm run test:contracts

frontend:architecture:
  stage: test
  image: node:20.19-slim
  extends: .frontend_cache
  script:
    - cd frontend
    - !reference [.npm_ci, script]
    - npx vitest run tests/architecture.test.ts

backend:test:
  stage: test
  image: node:20.19   # pinned: node:20 drifted to v20.20.2 whose x64 V8 JIT crashes
  services:
    - postgres:15
  variables:
    POSTGRES_DB: toolshare_test
    POSTGRES_USER: toolshare
    POSTGRES_PASSWORD: testpass
    POSTGRES_HOST_AUTH_METHOD: trust
    DATABASE_URL: "postgresql://toolshare:testpass@postgres:5432/toolshare_test"
  extends: .backend_cache
  timeout: 15m
  script:
    - cd backend
    - npm ci --workspaces=false --prefer-offline --cache .npm
    - !reference [.pg_wait, script]
    - |
      for attempt in 1 2 3; do
        npx prisma db push --skip-generate && break
        echo "prisma db push failed (attempt $attempt) -- retrying in 3s"; sleep 3
      done
    - npm run test -- --coverage
    - node ../scripts/check-coverage.js coverage
  coverage: '/All files\s+\|\s+(\d+\.\d+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage/cobertura-coverage.xml
      junit: backend/junit.xml
    paths:
      - backend/coverage/
    expire_in: 1 week

# === MOBILE JOBS ===
#
# The mobile app is an Expo / React Native client: it runs on-device and only
# talks to the backend over HTTP. There is therefore no server-side build to
# produce in CI -- bundling happens via EAS/expo on the client side -- so the
# pipeline only lints and unit-tests the shared business logic.

mobile:lint:
  stage: lint
  image: node:20.19-alpine   # pinned: node:20 drifted to v20.20.2 whose x64 V8 JIT crashes
  extends: .mobile_cache
  cache:
    policy: pull-push   # lint runs first -> it seeds the shared npm cache
  script:
    - !reference [.mobile_install, script]
    - npm run lint -- -f html -o ../mobile-lint-report.html || true
    - npm run lint
  artifacts:
    when: always
    paths:
      - mobile-lint-report.html

mobile:test:
  stage: test
  image: node:20.19-slim
  extends: .mobile_cache
  timeout: 15m
  variables:
    NODE_OPTIONS: "--max-old-space-size=2048"
  script:
    - !reference [.mobile_install, script]
    - npm run test -- --coverage
    - node ../scripts/check-coverage.js coverage
  coverage: '/Lines:\s+(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: mobile/coverage/cobertura-coverage.xml
      junit: mobile/junit.xml
    paths:
      - mobile/coverage/
    expire_in: 1 week

# === BUILD JOBS ===

frontend:build:
  stage: build
  # Pinned off the floating node:20 tag: it drifted to v20.20.2, whose
  # linux-x64 V8 build intermittently corrupts tsc and crashes it deep in
  # its internals ("Cannot read properties of undefined (reading 'flags')").
  # 20.19 is the last minor before that regression.
  image: node:20.19-slim
  extends: .frontend_cache
  script:
    - cd frontend
    - npm ci --workspaces=false --prefer-offline --cache .npm
    # tsc occasionally crashes internally on shared runners (V8 JIT); retry before failing.
    - |
      ok=0
      for attempt in 1 2 3; do
        if npm run build; then
          ok=1
          break
        fi
        echo "npm run build failed (attempt $attempt) -- retrying in 3s"
        sleep 3
      done
      [ "$ok" -eq 1 ]

backend:build:
  stage: build
  # See frontend:build: pinned off floating node:20 (v20.20.2) whose x64 V8
  # build crashes tsc during emit ("Cannot read properties of undefined").
  image: node:20.19-slim
  extends: .backend_cache
  needs:
    - backend:test
  script:
    - cd backend
    # npm ci has intermittently segfaulted on shared runners; retry before failing.
    - |
      ok=0
      for attempt in 1 2 3; do
        if npm ci --workspaces=false --prefer-offline --cache .npm; then
          ok=1
          break
        fi
        echo "npm ci failed (attempt $attempt) -- retrying in 3s"
        sleep 3
      done
      [ "$ok" -eq 1 ]
    # Install dependencies for shared package so ts-node can resolve zod during generate-openapi
    - npm install --prefix ../shared --prefer-offline --no-audit --no-fund --cache .npm
    - npm run build --prefix ../shared
    # tsc occasionally crashes internally on shared runners (V8 JIT); retry before failing.
    - |
      ok=0
      for attempt in 1 2 3; do
        if npm run build; then
          ok=1
          break
        fi
        echo "npm run build failed (attempt $attempt) -- retrying in 3s"
        sleep 3
      done
      [ "$ok" -eq 1 ]

# === DEPLOY JOB ===

deploy:production:
  stage: deploy
  image:
    name: docker:27.3.1-cli
    entrypoint: [""]
  tags:
    - server
    - deploy
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
  needs:
    - frontend:build
    - frontend:accessibility
    - backend:build
  interruptible: false   # never cancel an in-flight production deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: production
  before_script:
    - apk add --no-cache docker-cli-compose
    - chmod +x scripts/deploy-prod.sh
  script:
    - ./scripts/deploy-prod.sh

# === PAGES JOB ===

pages:
  stage: pages
  image: alpine:latest
  needs:
    - frontend:lint
    - frontend:test
    - frontend:accessibility
    - backend:lint
    - backend:test
    - mobile:lint
    - mobile:test
    - job: security:container:trivy
      optional: true
    - job: semgrep-sast
      optional: true

  script:
    - apk add --no-cache bash
    - mkdir public
    - |
      cat <<EOF > public/index.html
      <!DOCTYPE html>
      <html lang="de">
      <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>ToolShare Quality & Metrics Dashboard</title>
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
          <style>
              :root {
                  --bg-color: #0b0f19;
                  --card-bg: rgba(22, 28, 45, 0.6);
                  --card-border: rgba(255, 255, 255, 0.08);
                  --primary: #3b82f6;
                  --primary-glow: rgba(59, 130, 246, 0.15);
                  --success: #10b981;
                  --success-glow: rgba(16, 185, 129, 0.15);
                  --text-main: #f8fafc;
                  --text-muted: #94a3b8;
                  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
              }
              * {
                  box-sizing: border-box;
                  margin: 0;
                  padding: 0;
              }
              body {
                  font-family: 'Outfit', sans-serif;
                  background-color: var(--bg-color);
                  background-image: 
                      radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.1) 0px, transparent 50%),
                      radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
                  color: var(--text-main);
                  min-height: 100vh;
                  padding: 3rem 1.5rem;
                  display: flex;
                  flex-direction: column;
                  align-items: center;
              }
              .container {
                  width: 100%;
                  max-width: 1000px;
              }
              header {
                  text-align: center;
                  margin-bottom: 4rem;
                  position: relative;
              }
              .logo-area {
                  display: inline-flex;
                  align-items: center;
                  gap: 0.75rem;
                  margin-bottom: 1rem;
              }
              .logo-icon {
                  width: 42px;
                  height: 42px;
                  background: linear-gradient(135deg, var(--primary), var(--success));
                  border-radius: 12px;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
              }
              .logo-icon svg {
                  width: 22px;
                  height: 22px;
                  fill: white;
              }
              h1 {
                  font-size: 2.5rem;
                  font-weight: 700;
                  letter-spacing: -0.025em;
                  background: linear-gradient(to right, #ffffff, #94a3b8);
                  -webkit-background-clip: text;
                  -webkit-text-fill-color: transparent;
              }
              .tagline {
                  color: var(--text-muted);
                  font-size: 1.1rem;
                  margin-top: 0.5rem;
              }
              .status-badge {
                  display: inline-flex;
                  align-items: center;
                  gap: 0.5rem;
                  background: rgba(16, 185, 129, 0.1);
                  border: 1px solid rgba(16, 185, 129, 0.2);
                  color: var(--success);
                  padding: 0.35rem 0.75rem;
                  border-radius: 9999px;
                  font-size: 0.85rem;
                  font-weight: 500;
                  margin-top: 1rem;
              }
              .status-dot {
                  width: 8px;
                  height: 8px;
                  background-color: var(--success);
                  border-radius: 50%;
                  animation: pulse 2s infinite;
              }
              @keyframes pulse {
                  0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
                  70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
                  100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
              }
              .section-title {
                  font-size: 1.5rem;
                  font-weight: 600;
                  margin-bottom: 1.5rem;
                  display: flex;
                  align-items: center;
                  gap: 0.5rem;
                  color: #ffffff;
                  border-left: 4px solid var(--primary);
                  padding-left: 0.75rem;
              }
              .section-title.backend {
                  border-left-color: var(--success);
              }
              .section-title.security {
                  border-left-color: #ef4444;
              }
              .grid {
                  display: grid;
                  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
                  gap: 2rem;
                  margin-bottom: 4rem;
              }
              .card {
                  background-color: var(--card-bg);
                  border: 1px solid var(--card-border);
                  border-radius: 16px;
                  padding: 2rem;
                  position: relative;
                  overflow: hidden;
                  backdrop-filter: blur(12px);
                  -webkit-backdrop-filter: blur(12px);
                  transition: var(--transition);
                  display: flex;
                  flex-direction: column;
                  justify-content: space-between;
              }
              .card::before {
                  content: '';
                  position: absolute;
                  top: 0;
                  left: 0;
                  width: 100%;
                  height: 4px;
                  background: linear-gradient(90deg, var(--primary), transparent);
                  opacity: 0.5;
                  transition: var(--transition);
              }
              .card.backend-card::before {
                  background: linear-gradient(90deg, var(--success), transparent);
              }
              .card.security-card::before {
                  background: linear-gradient(90deg, #ef4444, transparent);
              }
              .card:hover {
                  transform: translateY(-5px);
                  border-color: rgba(255, 255, 255, 0.15);
                  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), 0 0 40px var(--primary-glow);
              }
              .card.backend-card:hover {
                  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), 0 0 40px var(--success-glow);
              }
              .card.security-card:hover {
                  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), 0 0 40px rgba(239, 68, 68, 0.15);
              }
              .card-header {
                  display: flex;
                  align-items: flex-start;
                  justify-content: space-between;
                  margin-bottom: 1.5rem;
              }
              .card-icon {
                  width: 48px;
                  height: 48px;
                  border-radius: 12px;
                  background: rgba(255, 255, 255, 0.03);
                  border: 1px solid var(--card-border);
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  color: var(--primary);
                  transition: var(--transition);
              }
              .card.backend-card .card-icon {
                  color: var(--success);
              }
              .card.security-card .card-icon {
                  color: #ef4444;
              }
              .card:hover .card-icon {
                  background: var(--primary);
                  color: white;
                  box-shadow: 0 0 15px var(--primary);
              }
              .card.backend-card:hover .card-icon {
                  background: var(--success);
                  color: white;
                  box-shadow: 0 0 15px var(--success);
              }
              .card.security-card:hover .card-icon {
                  background: #ef4444;
                  color: white;
                  box-shadow: 0 0 15px #ef4444;
              }
              .card-icon svg {
                  width: 24px;
                  height: 24px;
                  fill: currentColor;
              }
              .card-title {
                  font-size: 1.25rem;
                  font-weight: 600;
                  color: #ffffff;
                  margin-bottom: 0.5rem;
              }
              .card-description {
                  color: var(--text-muted);
                  font-size: 0.95rem;
                  line-height: 1.6;
                  margin-bottom: 2rem;
                  flex-grow: 1;
              }
              .card-action {
                  display: inline-flex;
                  align-items: center;
                  justify-content: center;
                  gap: 0.5rem;
                  width: 100%;
                  background: rgba(255, 255, 255, 0.05);
                  border: 1px solid var(--card-border);
                  color: #ffffff;
                  font-weight: 500;
                  text-decoration: none;
                  padding: 0.85rem;
                  border-radius: 10px;
                  font-size: 0.95rem;
                  transition: var(--transition);
                  cursor: pointer;
              }
              .card-action svg {
                  width: 16px;
                  height: 16px;
                  fill: currentColor;
                  transition: var(--transition);
              }
              .card-action:hover {
                  background: var(--primary);
                  border-color: var(--primary);
                  box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
              }
              .card.backend-card .card-action:hover {
                  background: var(--success);
                  border-color: var(--success);
                  box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
              }
              .card.security-card .card-action:hover {
                  background: #ef4444;
                  border-color: #ef4444;
                  box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
              }
              .card-action:hover svg {
                  transform: translateX(3px);
              }
              footer {
                  margin-top: auto;
                  text-align: center;
                  color: var(--text-muted);
                  font-size: 0.85rem;
                  border-top: 1px solid var(--card-border);
                  padding-top: 2rem;
                  width: 100%;
              }
          </style>
      </head>
      <body>
          <div class="container">
              <header>
                  <div class="logo-area">
                      <div class="logo-icon">
                          <svg viewBox="0 0 24 24">
                              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                          </svg>
                      </div>
                  </div>
                  <h1>ToolShare Quality & Metrics Dashboard</h1>
                  <p class="tagline">Automatisierte Code-Analysen, Linter-Reports und Testergebnisse</p>
                  <div class="status-badge">
                      <div class="status-dot"></div>
                      <span>CI/CD Pipeline Aktiv</span>
