server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

# Position-Datei: Promtail merkt sich, wie weit es in jeder Log-Datei gelesen hat.
# Bei Neustart wird nahtlos fortgesetzt (kein Datenverlust, keine Duplikate).
positions:
  filename: /tmp/positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    # Backoff bei Loki-Nichterreichbarkeit
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10
    # Timeout für Push-Requests
    timeout: 10s

scrape_configs:

  # ── Docker Container Logs ─────────────────────────────────────────────────
  # Liest alle Container-Logs über Docker Service Discovery.
  # Docker schreibt Logs als JSON nach /var/lib/docker/containers/<id>/<id>-json.log
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          # Nur laufende Container
          - name: status
            values: ["running"]

    relabel_configs:
      # Container-Name als Label (z.B. "toolshare-backend")
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container

      # Docker-Image als Label
      - source_labels: ["__meta_docker_container_image"]
        target_label: image

      # Compose-Service-Name (falls vorhanden)
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service

      # Compose-Projektname
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: compose_project

      # Log-Pfad aus Docker-Metadaten setzen
      - source_labels: ["__meta_docker_container_id"]
        target_label: "__path__"
        replacement: "/var/lib/docker/containers/$1/$1-json.log"

      # Job-Label auf "docker" setzen
      - target_label: job
        replacement: docker

    pipeline_stages:
      # Docker-JSON-Format parsen: {"log":"...", "stream":"stdout", "time":"..."}
      - json:
          expressions:
            output: log
            stream: stream
            timestamp: time

      # stdout/stderr als Label
      - labels:
          stream:

      # HTTP-Status-Code extrahieren (für log-basierte 5xx-/Fehlerraten).
      # Greift bei nginx-Access-Logs (z.B. frontend): "GET /x HTTP/1.1" 502 …
      # Zeilen ohne dieses Muster bleiben unberührt (kein Label) → keine Cardinality.
      - regex:
          expression: '"(?P<method>GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS) (?P<path>/[^\s"]*) HTTP/[0-9.]+" (?P<status>[0-9]{3})'
          source: output

      - labels:
          status:
          method:

      # Log-Level aus Nachricht extrahieren (heuristisch)
      - regex:
          expression: '(?i)(?P<level>error|warn(?:ing)?|info|debug|fatal|panic|trace)'
          source: output

      - labels:
          level:

      # Timestamp aus Docker-Log übernehmen
      - timestamp:
          source: timestamp
          format: RFC3339Nano

      # Eigentliche Log-Nachricht als Output setzen
      - output:
          source: output

  # ── Toolshare Backend (spezifische Konfiguration) ─────────────────────────
  - job_name: toolshare-backend
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["toolshare-backend", "toolshare_backend_1"]

    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_id"]
        target_label: "__path__"
        replacement: "/var/lib/docker/containers/$1/$1-json.log"
      - target_label: job
        replacement: toolshare
      - target_label: service
        replacement: backend

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            timestamp: time
      - labels:
          stream:
      # HTTP-Status-Code extrahieren (für Log-basierte Metriken)
      - regex:
          expression: '(?P<method>GET|POST|PUT|PATCH|DELETE|HEAD) (?P<path>/[^\s]*) HTTP/[0-9.]+ (?P<status>[0-9]{3})'
          source: output
      - labels:
          status:
          method:
      # Log-Level
      - regex:
          expression: '(?i)(?P<level>error|warn(?:ing)?|info|debug|fatal)'
          source: output
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - output:
          source: output

  # ── System-Logs (Linux /var/log) ──────────────────────────────────────────
  # Nur auf Linux-Servern relevant; lokal meist leer/nicht vorhanden
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          __path__: /var/log/syslog

    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\w+ \d+ \d+:\d+:\d+) (?P<host>\S+) (?P<service>\S+): (?P<message>.*)$'
      - labels:
          host:
          service:
      - output:
          source: message
