auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

# ── Ingester (Schreibpuffer vor Chunk-Persistierung) ──────────────────────────
ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
  # Chunk-Konfiguration mit snappy-Kompression (~50-60% Platzeinsparung)
  chunk_idle_period: 5m
  chunk_retain_period: 30s
  max_transfer_retries: 0
  wal:
    enabled: true
    dir: /loki/wal
  chunk_encoding: snappy

# ── Schema & Storage ──────────────────────────────────────────────────────────
schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v12
      index:
        prefix: index_
        period: 24h

storage_config:
  boltdb_shipper:
    active_index_directory: /loki/boltdb-shipper-active
    cache_location: /loki/boltdb-shipper-cache
    cache_ttl: 24h
    shared_store: filesystem
  filesystem:
    directory: /loki/chunks

# ── Compactor (Komprimiert und bereinigt alte Chunks) ────────────────────────
compactor:
  working_directory: /loki/boltdb-shipper-compactor
  shared_store: filesystem
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

# ── Limits & Retention ────────────────────────────────────────────────────────
limits_config:
  # Globale Log-Retention (30 Tage)
  retention_period: 720h
  # Maximale Logs pro Sekunde pro Stream
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  # Maximale Anzahl gleichzeitiger Abfragen
  max_concurrent_tail_requests: 20
  # Maximale Log-Einträge pro Query
  max_entries_limit_per_query: 10000
  # Split & Cache für schnellere Queries.
  # 15m war zu fein: ein auto-refreshendes Dashboard zerlegte jede 1h-Query in
  # 4 Sub-Queries × viele Panels × 30s-Refresh → Query-Frontend-Queue lief über
  # ("too many outstanding requests", HTTP 500). 1h hält die Sub-Query-Zahl klein.
  split_queries_by_interval: 1h
  # Begrenzt die Parallelität pro Query (Schutz vor Querier-Überlast).
  max_query_parallelism: 8

# ── Query-Frontend ───────────────────────────────────────────────────────────
# Die per-Tenant-Queue des Query-Frontends. Der Default ist klein und lief unter
# dem Dashboard-Abfragesturm über → 500 "too many outstanding requests".
frontend:
  max_outstanding_per_tenant: 2048
  compress_responses: true

# ── Query-Optimierung ────────────────────────────────────────────────────────
query_range:
  results_cache:
    cache:
      enable_fifocache: true
      fifocache:
        max_size_bytes: 536870912  # 512 MB Cache
        validity: 10m

chunk_store_config:
  max_look_back_period: 720h  # Muss mit retention_period übereinstimmen

table_manager:
  retention_deletes_enabled: true
  retention_period: 720h

# ── Ruler (für Log-basierte Alerts, optional) ────────────────────────────────
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://localhost:9093
  ring:
    kvstore:
      store: inmemory
  enable_api: true
