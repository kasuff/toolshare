apiVersion: 1

providers:
  - name: "Toolshare Dashboards"
    orgId: 1
    folder: "Toolshare"
    folderUid: "toolshare"
    type: file
    disableDeletion: true       # Verhindert versehentliches Löschen per UI
    updateIntervalSeconds: 30   # Prüft alle 30s auf Änderungen in den JSON-Dateien
    allowUiUpdates: true        # Erlaubt UI-Anpassungen (werden aber nicht persistiert)
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
