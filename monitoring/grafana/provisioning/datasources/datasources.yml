apiVersion: 1

# Automatische Datasource-Provisionierung beim Grafana-Start.
# Änderungen hier werden beim nächsten Start übernommen.

datasources:
  # ── Prometheus ──────────────────────────────────────────────────────────────
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      prometheusVersion: "2.53.0"
      timeInterval: "15s"
      incrementalQuerying: true
      incrementalQueryOverlapWindow: "10m"
      exemplarTraceIdDestinations: []
      # Query-Timeout in Grafana (unabhängig vom Prometheus-seitigen Timeout)
      queryTimeout: "60s"
      # Maximale Datenpunkte pro Panel – begrenzt Speicher- und CPU-Last
      defaultEditor: "builder"

  # ── Loki ────────────────────────────────────────────────────────────────────
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000          # Weniger als vorher (5000) → deutlich weniger Last
      timeout: "30"           # Sekunden bis Loki-Query-Timeout
      derivedFields:
        - datasourceUid: prometheus
          matcherRegex: "requestId=(\\w+)"
          name: RequestID
          url: ""
