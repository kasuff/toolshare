version: "3.8"

# Toolshare Observability Stack
# Starten: docker compose -f monitoring/docker-compose.yml up -d
# Stoppen:  docker compose -f monitoring/docker-compose.yml down
#
# Voraussetzung: Haupt-App muss gestartet sein (erzeugt das toolshare-network)
#   docker compose up -d
#   docker compose -f monitoring/docker-compose.yml up -d

services:
  # ─── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: toolshare-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      # Admin-Zugangsdaten
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Anonymen Zugriff deaktivieren
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Grafana URL (für Embedding und Alerts)
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      # Embedding per iframe erlauben (für Admin-Portal)
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # Plugins
      GF_INSTALL_PLUGINS: ""
      # Reporting vorbereiten (Grafana Enterprise Feature – hier als Platzhalter)
      GF_FEATURE_TOGGLES_ENABLE: "publicDashboards"
      # Logging
      GF_LOG_MODE: console
      GF_LOG_LEVEL: warn
      # Provisioning
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monitoring-network
      - toolshare-network

  # ─── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: toolshare-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}"
      - "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-10GB}"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"       # POST /-/reload für Hot-Reload
      - "--web.enable-admin-api"       # Für direkte API-Abfragen aus dem Admin-Portal
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monitoring-network
      - toolshare-network

  # ─── Loki ───────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.8
    container_name: toolshare-loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - monitoring-network

  # ─── Promtail ───────────────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:2.9.8
    container_name: toolshare-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Docker-Socket für Container-Discovery
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Docker-Container-Logs (Linux-Pfad)
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Systemlogs (optional, Linux)
      - /var/log:/var/log:ro
      # Positions-Datei: merkt sich gelesene Log-Positionen
      - promtail-positions:/tmp/positions
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - monitoring-network
      - toolshare-network

  # ─── Node Exporter ──────────────────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: toolshare-node-exporter
    restart: unless-stopped
    # Kein Host-Port nötig: nur intern von Prometheus abgefragt
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    pid: host
    networks:
      - monitoring-network

volumes:
  grafana-data:
    driver: local
  prometheus-data:
    driver: local
  loki-data:
    driver: local
  promtail-positions:
    driver: local

networks:
  # Internes Monitoring-Netz (Prometheus → Loki/Node-Exporter)
  monitoring-network:
    driver: bridge

  # Gemeinsames Netz mit der App (Prometheus → Backend /metrics)
  toolshare-network:
    external: true
    name: toolshare-network
