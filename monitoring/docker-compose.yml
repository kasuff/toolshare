version: "3.8"

# Toolshare Observability Stack
# Starten: docker compose -f monitoring/docker-compose.yml up -d
# Stoppen:  docker compose -f monitoring/docker-compose.yml down
#
# Voraussetzung: Haupt-App muss gestartet sein (erzeugt das toolshare-network)
#   docker compose up -d
#   docker compose -f monitoring/docker-compose.yml up -d

services:
  # ─── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: toolshare-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      # Admin-Zugangsdaten
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Anonymer Viewer-Zugriff: erlaubt iframe-Embedding ohne Login
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      # Grafana URL (für Embedding und Alerts)
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      # Embedding per iframe erlauben (für Admin-Portal)
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # Plugins
      GF_INSTALL_PLUGINS: ""
      # Reporting vorbereiten
      GF_FEATURE_TOGGLES_ENABLE: "publicDashboards"
      # Logging
      GF_LOG_MODE: console
      GF_LOG_LEVEL: warn
      # Provisioning
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning

      # ── Ressourcenschutz ──────────────────────────────────────────────────
      # Max. gleichzeitige HTTP-Verbindungen zum Grafana-Server
      GF_SERVER_ROUTER_LOGGING: "false"

      # Datenbankverbindungen begrenzen (SQLite intern)
      GF_DATABASE_MAX_OPEN_CONN: "10"
      GF_DATABASE_MAX_IDLE_CONN: "5"
      GF_DATABASE_CONN_MAX_LIFETIME: "14400"   # 4h in Sekunden

      # Dashboard-Query-Limits: verhindert teure Abfragen
      GF_DATAPROXY_TIMEOUT: "30"               # Sekunden bis Datasource-Timeout
      GF_DATAPROXY_KEEP_ALIVE_SECONDS: "30"
      GF_DATAPROXY_MAX_IDLE_CONNECTIONS: "64"

      # Rendering-Limit (PNG/PDF-Export, sehr CPU-intensiv)
      GF_RENDERING_CONCURRENT_RENDER_LIMIT: "2"
      GF_RENDERING_RENDER_KEY_LIFETIME: "5m"

      # Rate Limiting (ab Grafana 9.x)
      GF_RATE_LIMITING_ENABLED: "true"
      GF_RATE_LIMITING_RATE: "${GRAFANA_RATE_LIMIT:-50}"      # Req/s pro IP
      GF_RATE_LIMITING_BURST_SIZE: "${GRAFANA_BURST_SIZE:-100}"

      # Alert-History-Bereinigung verhindert Datenbankaufblähung
      GF_ALERTING_MAX_ANNOTATION_AGE: "30d"
      GF_ANNOTATIONS_MAX_AGE: "30d"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    # ── Docker-Ressourcenlimits ──────────────────────────────────────────────
    deploy:
      resources:
        limits:
          cpus: "${GRAFANA_CPU_LIMIT:-0.50}"    # max. 50% eines CPU-Kerns
          memory: "${GRAFANA_MEM_LIMIT:-512M}"
        reservations:
          cpus: "0.05"
          memory: "128M"
    networks:
      - monitoring-network
      - toolshare-network

  # ─── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: toolshare-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}"
      - "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-10GB}"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
      # ── Query-Throttling ────────────────────────────────────────────────
      # Max. parallele Queries (default: 20 – für kleinen Server reduzieren)
      - "--query.max-concurrency=${PROMETHEUS_MAX_CONCURRENCY:-10}"
      # Max. Ausführungszeit pro Query (verhindert hängende Abfragen)
      - "--query.timeout=${PROMETHEUS_QUERY_TIMEOUT:-60s}"
      # Max. Samples pro Query (verhindert Memory-Spikes bei großen Ranges)
      - "--query.max-samples=${PROMETHEUS_MAX_SAMPLES:-5000000}"
      # Max. gleichzeitige HTTP-Verbindungen
      - "--web.max-connections=${PROMETHEUS_MAX_CONNECTIONS:-100}"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts:/etc/prometheus/alerts
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "${PROMETHEUS_CPU_LIMIT:-0.50}"
          memory: "${PROMETHEUS_MEM_LIMIT:-512M}"
        reservations:
          cpus: "0.05"
          memory: "128M"
    networks:
      - monitoring-network
      - toolshare-network

  # ─── Loki ───────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.8
    container_name: toolshare-loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "${LOKI_CPU_LIMIT:-0.50}"
          memory: "${LOKI_MEM_LIMIT:-512M}"
        reservations:
          cpus: "0.05"
          memory: "128M"
    networks:
      - monitoring-network

  # ─── Promtail ───────────────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:2.9.8
    container_name: toolshare-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
      - promtail-positions:/tmp/positions
    depends_on:
      loki:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "128M"
        reservations:
          cpus: "0.02"
          memory: "32M"
    networks:
      - monitoring-network
      - toolshare-network

  # ─── Node Exporter ──────────────────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: toolshare-node-exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    pid: host
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "64M"
        reservations:
          cpus: "0.01"
          memory: "16M"
    networks:
      - monitoring-network

volumes:
  grafana-data:
    driver: local
  prometheus-data:
    driver: local
  loki-data:
    driver: local
  promtail-positions:
    driver: local

networks:
  # Internes Monitoring-Netz (Prometheus → Loki/Node-Exporter)
  monitoring-network:
    driver: bridge

  # Gemeinsames Netz mit der App (Prometheus → Backend /metrics)
  toolshare-network:
    external: true
    name: toolshare-network
