version: "3.8"

# Toolshare Observability Stack
# Starten: docker compose -f monitoring/docker-compose.yml up -d
# Stoppen:  docker compose -f monitoring/docker-compose.yml down
#
# Voraussetzung: Haupt-App muss gestartet sein (erzeugt das toolshare-network)
#   docker compose up -d
#   docker compose -f monitoring/docker-compose.yml up -d

services:
  # ─── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    # Config (Provisioning + Dashboards) ins Image gebacken statt gemountet,
    # damit der Deploy ohne Repo-Bind-Mounts auf dem Docker-Host funktioniert.
    build:
      context: ./grafana
    container_name: toolshare-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      # Admin-Zugangsdaten. Kein unsicherer Default für das Passwort: ist
      # GRAFANA_ADMIN_PASSWORD nicht (oder leer) gesetzt, bricht `docker compose`
      # mit Fehler ab, statt mit admin/admin offen hochzufahren.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD muss gesetzt sein}
      # Anonymer Viewer-Zugriff: erlaubt iframe-Embedding ohne Login
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      # Grafana URL (für Embedding und Alerts).
      # Muss den Sub-Pfad /grafana enthalten, da Grafana hinter dem Frontend-nginx
      # unter <origin>/grafana/ ausgeliefert wird (siehe frontend/nginx.conf).
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001/grafana/}
      # Assets/Links mit /grafana-Prefix generieren und Requests unter dem
      # Sub-Pfad korrekt verarbeiten.
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Embedding per iframe erlauben (für Admin-Portal)
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # Plugins
      GF_INSTALL_PLUGINS: ""
      # Reporting vorbereiten
      GF_FEATURE_TOGGLES_ENABLE: "publicDashboards"
      # Logging
      GF_LOG_MODE: console
      GF_LOG_LEVEL: warn
      # Provisioning
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning

      # ── Ressourcenschutz ──────────────────────────────────────────────────
      # Max. gleichzeitige HTTP-Verbindungen zum Grafana-Server
      GF_SERVER_ROUTER_LOGGING: "false"

      # Datenbankverbindungen begrenzen (SQLite intern)
      GF_DATABASE_MAX_OPEN_CONN: "10"
      GF_DATABASE_MAX_IDLE_CONN: "5"
      GF_DATABASE_CONN_MAX_LIFETIME: "14400"   # 4h in Sekunden

      # Dashboard-Query-Limits: verhindert teure Abfragen
      GF_DATAPROXY_TIMEOUT: "30"               # Sekunden bis Datasource-Timeout
      GF_DATAPROXY_KEEP_ALIVE_SECONDS: "30"
      GF_DATAPROXY_MAX_IDLE_CONNECTIONS: "64"

      # Rendering-Limit (PNG/PDF-Export, sehr CPU-intensiv)
      GF_RENDERING_CONCURRENT_RENDER_LIMIT: "2"
      GF_RENDERING_RENDER_KEY_LIFETIME: "5m"

      # Rate Limiting (ab Grafana 9.x)
      GF_RATE_LIMITING_ENABLED: "true"
      GF_RATE_LIMITING_RATE: "${GRAFANA_RATE_LIMIT:-50}"      # Req/s pro IP
      GF_RATE_LIMITING_BURST_SIZE: "${GRAFANA_BURST_SIZE:-100}"

      # Alert-History-Bereinigung verhindert Datenbankaufblähung
      GF_ALERTING_MAX_ANNOTATION_AGE: "30d"
      GF_ANNOTATIONS_MAX_AGE: "30d"

    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    # ── Docker-Ressourcenlimits ──────────────────────────────────────────────
    deploy:
      resources:
        limits:
          cpus: "${GRAFANA_CPU_LIMIT:-0.50}"    # max. 50% eines CPU-Kerns
          memory: "${GRAFANA_MEM_LIMIT:-512M}"
        reservations:
          cpus: "0.05"
          memory: "128M"
    networks:
      - monitoring-network
      - toolshare-network

  # ─── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    # Config + Alert-Regeln ins Image gebacken statt gemountet (s. grafana).
    build:
      context: ./prometheus
    container_name: toolshare-prometheus
    restart: unless-stopped
    ports:
      # Nur an localhost binden: der Host-Port dient bloß dem Debugging per
      # SSH-Tunnel. Grafana/Exporter scrapen Prometheus über das Docker-Netz
      # (http://prometheus:9090), nicht über diesen veröffentlichten Port.
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}"
      - "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-10GB}"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
      # --web.enable-admin-api bewusst NICHT aktiviert: die Admin-API erlaubt
      # ungeschütztes Löschen von Zeitreihen (/api/v1/admin/tsdb/...).
      # ── Query-Throttling ────────────────────────────────────────────────
      # Max. parallele Queries (default: 20 – für kleinen Server reduzieren)
      - "--query.max-concurrency=${PROMETHEUS_MAX_CONCURRENCY:-10}"
      # Max. Ausführungszeit pro Query (verhindert hängende Abfragen)
      - "--query.timeout=${PROMETHEUS_QUERY_TIMEOUT:-60s}"
      # Max. Samples pro Query (verhindert Memory-Spikes bei großen Ranges)
      - "--query.max-samples=${PROMETHEUS_MAX_SAMPLES:-5000000}"
      # Max. gleichzeitige HTTP-Verbindungen
      - "--web.max-connections=${PROMETHEUS_MAX_CONNECTIONS:-100}"
    volumes:
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "${PROMETHEUS_CPU_LIMIT:-0.50}"
          memory: "${PROMETHEUS_MEM_LIMIT:-512M}"
        reservations:
          cpus: "0.05"
          memory: "128M"
    networks:
      - monitoring-network
      - toolshare-network

  # ─── Loki ───────────────────────────────────────────────────────────────────
  loki:
    # Config ins Image gebacken statt gemountet (s. grafana).
    build:
      context: ./loki
    container_name: toolshare-loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "${LOKI_CPU_LIMIT:-0.50}"
          memory: "${LOKI_MEM_LIMIT:-512M}"
        reservations:
          cpus: "0.05"
          memory: "128M"
    networks:
      # monitoring-network: Promtail/Grafana erreichen Loki.
      # toolshare-network: Backend (/api/monitoring/logs) erreicht Loki – sonst
      # ENOTFOUND beim fetch → HTTP 500. Vgl. Prometheus, das ebenfalls an
      # beiden Netzen hängt.
      - monitoring-network
      - toolshare-network

  # ─── Promtail ───────────────────────────────────────────────────────────────
  promtail:
    # Config ins Image gebacken statt gemountet (s. grafana). Die Host-Mounts
    # darunter bleiben – das sind echte Host-Pfade.
    build:
      context: ./promtail
    container_name: toolshare-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
      - promtail-positions:/tmp/positions
    depends_on:
      loki:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "128M"
        reservations:
          cpus: "0.02"
          memory: "32M"
    networks:
      - monitoring-network
      - toolshare-network

  # ─── DORA Exporter ──────────────────────────────────────────────────────────
  # Berechnet die vier DORA-Metriken und stellt sie unter /metrics bereit.
  # PDF-Report on demand unter /report.pdf?days=90.
  dora-exporter:
    build:
      context: ./dora-exporter
    container_name: toolshare-dora-exporter
    restart: unless-stopped
    ports:
      # Nur an localhost binden (wie Prometheus): der Exporter wird intern über
      # das Docker-Netz erreicht (Backend → dora-exporter:9110). Der Host-Port
      # dient nur dem Debugging und ist nicht öffentlich.
      - "127.0.0.1:${DORA_PORT:-9110}:9110"
    environment:
      # ── GitLab (Deployment Frequency + Lead Time) ──────────────────────────
      GITLAB_URL: ${GITLAB_URL:-https://gitlab.lrz.de}
      GITLAB_PROJECT: ${GITLAB_PROJECT:-}          # z. B. "gruppe/toolshare" oder Projekt-ID
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}              # Token mit Scope read_api
      GITLAB_PRODUCTION_ENV: ${GITLAB_PRODUCTION_ENV:-production}
      # ── Ausfälle (Change Failure Rate + Time to Restore) ───────────────────
      # "prometheus_alerts" = automatisch aus kritischen Alerts (kein Aufwand)
      # "gitlab_incidents"  = GitLab-Issues vom Typ incident
      OUTAGE_SOURCE: ${DORA_OUTAGE_SOURCE:-prometheus_alerts}
      OUTAGE_ALERT_SEVERITY: ${DORA_OUTAGE_SEVERITY:-critical}
      # Nur echte Availability-Alerts zählen als Ausfall (schließt z. B. das
      # dauerhaft feuernde DiskSpaceCritical aus). Komma-Liste; leer = alle.
      OUTAGE_ALERTNAMES: ${DORA_OUTAGE_ALERTNAMES:-BackendDown,InstanceDown}
      PROMETHEUS_URL: http://prometheus:9090
      # ── Berechnung ─────────────────────────────────────────────────────────
      DORA_WINDOW_DAYS: ${DORA_WINDOW_DAYS:-30}
      # Ein Deployment gilt als "failed", wenn binnen dieser Stunden ein Ausfall folgt.
      DORA_FAILURE_CORRELATION_HOURS: ${DORA_FAILURE_CORRELATION_HOURS:-2}
      COLLECT_INTERVAL_SECONDS: ${DORA_COLLECT_INTERVAL:-300}
      DORA_STATE_PATH: /data/state.json
    volumes:
      - dora-data:/data
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${DORA_CPU_LIMIT:-0.25}"
          memory: "${DORA_MEM_LIMIT:-256M}"
        reservations:
          cpus: "0.02"
          memory: "64M"
    networks:
      - monitoring-network
      - toolshare-network

  # ─── Node Exporter ──────────────────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: toolshare-node-exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    pid: host
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "64M"
        reservations:
          cpus: "0.01"
          memory: "16M"
    networks:
      - monitoring-network

volumes:
  grafana-data:
    driver: local
  prometheus-data:
    driver: local
  loki-data:
    driver: local
  promtail-positions:
    driver: local
  dora-data:
    driver: local

networks:
  # Internes Monitoring-Netz (Prometheus → Loki/Node-Exporter)
  monitoring-network:
    driver: bridge

  # Gemeinsames Netz mit der App (Prometheus → Backend /metrics)
  toolshare-network:
    external: true
    name: toolshare-network
