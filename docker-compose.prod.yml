# ─────────────────────────────────────────────────────────────────────────────
# WAL-G ↔ Cloudflare-R2-Konfiguration (S3-kompatibel).
#
# Wird von db (archive_command) UND walg-backup (backup-push/Retention) geteilt.
# Alle Werte kommen aus GitLab-CI/CD-Variablen — KEIN .env.backup mehr nötig
# (konsistent mit dem restlichen Stack, der ${VAR} ebenfalls aus dem CI-Env zieht).
#
# Eigener, PRIVATER Backup-Bucket (NICHT der öffentliche Bilder-Bucket R2_BUCKET):
#   R2_BACKUP_BUCKET            z. B. toolshare-db-backups
#   R2_BACKUP_ACCESS_KEY_ID     R2-API-Token (S3), möglichst nur für diesen Bucket
#   R2_BACKUP_SECRET_ACCESS_KEY
#   R2_ACCOUNT_ID               wird für den R2-S3-Endpoint wiederverwendet
# ─────────────────────────────────────────────────────────────────────────────
x-walg-env: &walg-env
  WALG_S3_PREFIX: s3://${R2_BACKUP_BUCKET}
  AWS_ENDPOINT: https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
  # R2 kennt keine echten Regionen; "auto" ist die kanonische Vorgabe.
  AWS_REGION: auto
  AWS_ACCESS_KEY_ID: ${R2_BACKUP_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${R2_BACKUP_SECRET_ACCESS_KEY}
  # R2 verlangt Path-Style-Adressierung (kein bucket.host Virtual-Hosting).
  AWS_S3_FORCE_PATH_STYLE: "true"
  # brotli komprimiert die Backups dichter als das lz4-Default → weniger R2-Speicher.
  WALG_COMPRESSION_METHOD: brotli
  # > 0 aktiviert Delta-Backups (Seiten-Differenz zum letzten Full).
  WALG_DELTA_MAX_STEPS: "6"

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        VITE_API_URL: /api
        VITE_GRAFANA_URL: /grafana
    ports:
      - "3000:80"
    depends_on:
      - backend
    # Wie backend/db: nach Reboot oder Crash automatisch wieder starten.
    restart: unless-stopped
    networks:
      - toolshare-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://toolshare:${POSTGRES_PASSWORD}@db:5432/toolshare
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      REDIS_URL: redis://redis:6379
      CACHE_BACKEND: redis
      MANAGER_EMAIL_ALLOWLIST: ${MANAGER_EMAIL_ALLOWLIST}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-r2}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "sh scripts/migrate-deploy.sh && node dist/index.js"
    restart: unless-stopped
    # Speicher deckeln: ein einzelner Container darf die VM (3,8 GB, kein Swap)
    # nicht komplett auffressen und damit den ganzen Gast einfrieren.
    mem_limit: 640m
    mem_reservation: 256m
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - toolshare-network

  db:
    # Custom-Image (statt postgres:16-alpine): enthält das wal-g-Binary, das
    # archive_command für die kontinuierliche WAL-Archivierung (PITR) braucht.
    # Gleiches Image wie walg-backup → wird nur einmal gebaut (gemeinsamer Tag).
    build:
      context: ./backup
    image: toolshare-pg-walg:local
    # Eigene postgresql.conf aktiviert wal_level/archive_mode/archive_command.
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    environment:
      # archive_command (= wal-g wal-push %p) erbt dieses Env → WAL-G/R2-Vars.
      <<: *walg-env
      POSTGRES_USER: toolshare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: toolshare
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backup/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolshare"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Postgres-Speicher deckeln (mit Reserve, damit die DB nicht selbst
    # OOM-gekillt wird). Zusammen mit dem Swap fängt das Spitzen ab.
    mem_limit: 1g
    mem_reservation: 512m
    networks:
      - toolshare-network

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - toolshare-network

  # ───────────────────────────────────────────────────────────────────────────
  # WAL-G Backup-Runner: erstellt per Cron Full-/Delta-Backups in den privaten
  # S3-Bucket und hält 4 Full-Backup-Ketten (~4 Wochen) vor.
  #   - Wöchentlich  So 02:00 → FULL  (neue Basis-Kette)
  #   - Täglich   Mo–Sa 02:00 → DELTA (Differenz seit letztem Full)
  # Teilt sich das pgdata-Volume (read-only) mit db und verbindet sich für
  # pg_backup_start/stop über das Docker-Netz (PGHOST=db).
  # ───────────────────────────────────────────────────────────────────────────
  #
  # ═══════════════════════════════════════════════════════════════════════════
  #  RESTORE-GUIDE  (Wiederherstellung aus einem WAL-G-Backup)
  # ═══════════════════════════════════════════════════════════════════════════
  #
  #  Voraussetzung: die R2_BACKUP_*-/R2_ACCOUNT_ID-Variablen sind im Env
  #  gesetzt (lokal export ... oder via GitLab-CI/CD-Variablen).
  #
  #  1) Verfügbare Backups auflisten:
  #       docker compose -f docker-compose.prod.yml run --rm \
  #         --entrypoint wal-g walg-backup backup-list
  #
  #  2) App + DB stoppen, damit nichts ins Datenverzeichnis schreibt:
  #       docker compose -f docker-compose.prod.yml stop backend db walg-backup
  #
  #  3) Altes Datenverzeichnis leeren (ACHTUNG: löscht aktuellen DB-Stand!):
  #       docker compose -f docker-compose.prod.yml run --rm --no-deps \
  #         --entrypoint sh db -c 'rm -rf /var/lib/postgresql/data/*'
  #
  #  4) Backup zurückspielen (LATEST = neuestes; oder konkreter Name aus Schritt 1).
  #     Das pgdata-Volume muss hier SCHREIBBAR sein → eigener One-Off-Container:
  #       docker compose -f docker-compose.prod.yml run --rm --no-deps \
  #         --entrypoint sh db -c \
  #         'wal-g backup-fetch /var/lib/postgresql/data LATEST'
  #
  #  5) Point-in-Time-Recovery aktivieren, damit Postgres die WALs nachspielt:
  #       docker compose -f docker-compose.prod.yml run --rm --no-deps \
  #         --entrypoint sh db -c '
  #           echo "restore_command = '\''wal-g wal-fetch %f %p'\''" \
  #             >> /var/lib/postgresql/data/postgresql.auto.conf;
  #           touch /var/lib/postgresql/data/recovery.signal'
  #     (Für PITR auf einen Zeitpunkt zusätzlich:
  #        recovery_target_time = '2026-06-13 01:30:00+00'  in postgresql.auto.conf)
  #
  #  6) DB starten — Postgres holt fehlende WALs via restore_command, spielt sie
  #     ein und verlässt den Recovery-Modus automatisch:
  #       docker compose -f docker-compose.prod.yml up -d db
  #       docker compose -f docker-compose.prod.yml logs -f db   # "database system is ready"
  #
  #  7) Rest hochfahren:
  #       docker compose -f docker-compose.prod.yml up -d
  # ═══════════════════════════════════════════════════════════════════════════
  walg-backup:
    # Gleiches Image wie db (wal-g + supercronic); db baut es, hier nur referenziert.
    image: toolshare-pg-walg:local
    build:
      context: ./backup
    # Standard-Entrypoint (Postgres) durch supercronic ersetzen → reiner Cron-Runner.
    entrypoint: ["/usr/local/bin/supercronic", "/etc/supercronic/crontab"]
    user: postgres
    environment:
      # WAL-G-/R2-Variablen (WALG_S3_PREFIX, AWS_*, Kompression, Delta-Steps).
      <<: *walg-env
      # Verbindung zur laufenden DB für pg_backup_start/stop.
      PGHOST: db
      PGPORT: "5432"
      PGUSER: toolshare
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: toolshare
      # Retention: 4 Full-Ketten (~4 Wochen) und Size-Budget gegen Bucket-Überlauf.
      RETAIN_FULL: ${BACKUP_RETAIN_FULL:-4}
      MAX_BACKUP_BYTES: ${BACKUP_MAX_BYTES:-8000000000}
    volumes:
      # backup-push liest nur das Datenverzeichnis → read-only genügt.
      - pgdata:/var/lib/postgresql/data:ro
      - ./backup/crontab:/etc/supercronic/crontab:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Schlanker Cron-Runner: knapp deckeln, damit er die VM nicht belastet.
    mem_limit: 256m
    mem_reservation: 64m
    networks:
      - toolshare-network

volumes:
  pgdata:

networks:
  toolshare-network:
    name: toolshare-network
    external: true
