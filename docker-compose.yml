version: "3.8"

services:
  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:4000/api
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      target: dev
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://toolshare:toolshare@db:5432/toolshare
      JWT_SECRET: dev-secret-change-in-production
      PORT: 4000
      MANAGER_EMAIL_ALLOWLIST: "mittermeier.lukas@web.de,unglertmaik@gmail.com,sauerwei@hm.edu,katalin.szentmiklosy@hm.edu"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma db push && npm run dev"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: toolshare
      POSTGRES_PASSWORD: toolshare
      POSTGRES_DB: toolshare
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolshare"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  frontend_node_modules:
