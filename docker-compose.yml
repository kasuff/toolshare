version: "3.8"

services:
  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:4000/api
    depends_on:
      - backend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 3000"
    networks:
      - toolshare-network

  backend:
    build:
      context: ./backend
      target: dev
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://toolshare:toolshare@db:5432/toolshare
      JWT_SECRET: dev-secret-change-in-production
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      MANAGER_EMAIL_ALLOWLIST: "mittermeier.lukas@web.de,unglertmaik@gmail.com,sauerwei@hm.edu,katalin.szentmiklosy@hm.edu"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma db push --accept-data-loss && npm run dev"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    networks:
      - toolshare-network

  db:
    image: postgres:16-alpine
    # Kein Host-Port: DB nur im Docker-Netz erreichbar (nicht von außen)
    environment:
      POSTGRES_USER: toolshare
      POSTGRES_PASSWORD: toolshare
      POSTGRES_DB: toolshare
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolshare"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - toolshare-network

volumes:
  pgdata:
  frontend_node_modules:

networks:
  toolshare-network:
    name: toolshare-network
    driver: bridge
