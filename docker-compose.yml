services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:4000/api
    depends_on:
      - backend
#    develop:
#      watch:
#        - action: sync
#          path: ./frontend/src
#          target: /app/src
#        - action: rebuild
#          path: ./frontend/package.json
#        - action: rebuild
#          path: ./frontend/package-lock.json
    networks:
      - toolshare-network

  backend:
    build:
      context: ./backend
      target: dev
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://toolshare:toolshare@db:5432/toolshare
      JWT_SECRET: dev-secret-change-in-production
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      REDIS_URL: redis://redis:6379
      CACHE_BACKEND: redis
      MANAGER_EMAIL_ALLOWLIST: "mittermeier.lukas@web.de,unglertmaik@gmail.com,sauerwei@hm.edu,katalin.szentmiklosy@hm.edu"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma db push --accept-data-loss && npm run dev"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    networks:
      - toolshare-network

  db:
    image: postgres:16-alpine
    # Kein Host-Port: DB nur im Docker-Netz erreichbar (nicht von außen)
    environment:
      POSTGRES_USER: toolshare
      POSTGRES_PASSWORD: toolshare
      POSTGRES_DB: toolshare
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolshare"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - toolshare-network

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - toolshare-network

volumes:
  pgdata:

networks:
  toolshare-network:
    name: toolshare-network
    driver: bridge
