services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:4000/api
    depends_on:
      - backend
#    develop:
#      watch:
#        - action: sync
#          path: ./frontend/src
#          target: /app/src
#        - action: rebuild
#          path: ./frontend/package.json
#        - action: rebuild
#          path: ./frontend/package-lock.json
    volumes:
      - ./frontend/src:/app/frontend/src
    networks:
      - toolshare-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://toolshare:toolshare@db:5432/toolshare
      JWT_SECRET: dev-secret-change-in-production
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      REDIS_URL: redis://redis:6379
      CACHE_BACKEND: redis
      MANAGER_EMAIL_ALLOWLIST: ${MANAGER_EMAIL_ALLOWLIST}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-dataurl}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma db push --accept-data-loss --skip-generate && npm run dev"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./shared:/shared
      - shared_node_modules:/shared/node_modules
    networks:
      - toolshare-network

  db:
    image: postgres:16-alpine
    # Kein Host-Port: DB nur im Docker-Netz erreichbar (nicht von außen)
    environment:
      POSTGRES_USER: toolshare
      POSTGRES_PASSWORD: toolshare
      POSTGRES_DB: toolshare
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolshare"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - toolshare-network

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - toolshare-network

volumes:
  pgdata:
  shared_node_modules:

networks:
  toolshare-network:
    name: toolshare-network
    driver: bridge
