server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Backend-Reverse-Proxy: das Frontend spricht das API same-origin unter /api an
  # (VITE_API_URL=/api), damit es ohne CORS auskommt. Hostname wie bei /grafana
  # zur Laufzeit per Docker-DNS auflösen (Variable + resolver), damit nginx auch
  # startet, wenn der Backend-Container noch nicht da ist.
  location /api/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream http://backend:4000;
    proxy_pass $backend_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Bild-Uploads (multipart) brauchen mehr als die 1 MB Standardgrenze.
    client_max_body_size 20m;
  }

  # Grafana-Reverse-Proxy: stellt die Monitoring-Panels unter derselben Origin
  # bereit, damit das Admin-Dashboard sie ohne Mixed-Content/CORS per iframe
  # einbetten kann (analog zu /api). Der Hostname wird per Docker-DNS zur
  # Laufzeit aufgelöst (Variable + resolver), weil der grafana-Container erst
  # nach dem Frontend startet — sonst würde nginx mit "host not found" abbrechen.
  location /grafana/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $grafana_upstream http://toolshare-grafana:3000;
    proxy_pass $grafana_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Grafana Live (WebSockets)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
  }

  # Schlanker Health-Endpoint für den Container-Healthcheck (kein Upstream nötig)
  # → der Deploy wertet ein kaputtes nginx nicht fälschlich als "ready".
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
