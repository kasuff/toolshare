apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-migrate
  namespace: toolshare
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: registry.example.com/toolshare/backend:latest
          imagePullPolicy: Always
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: toolshare-secrets
                  key: DATABASE_URL
