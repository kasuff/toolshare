apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: toolshare
  namespace: toolshare
spec:
  ingressClassName: nginx
  rules:
    - host: toolshare.example.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
