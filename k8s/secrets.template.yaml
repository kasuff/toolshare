apiVersion: v1
kind: Secret
metadata:
  name: toolshare-secrets
  namespace: toolshare
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me"
  JWT_SECRET: "change-me"
  DATABASE_URL: "postgresql://toolshare:change-me@postgres:5432/toolshare"
  # Öffentliche Frontend-URL (kommagetrennt für mehrere Origins)
  CORS_ORIGIN: "https://toolshare.example.com"
  # Kommagetrennte E-Mails mit Manager-Rolle beim ersten Login
  MANAGER_EMAIL_ALLOWLIST: "admin@example.com"
