# ─────────────────────────────────────────────────────────────────────────────
# Postgres-Konfiguration für WAL-G (Continuous Archiving + Delta-Backups)
#
# Wird in docker-compose.prod.yml als config_file gemountet:
#   command: postgres -c config_file=/etc/postgresql/postgresql.conf
#
# WICHTIG: Da diese Datei AUSSERHALB des Datenverzeichnisses liegt, müssen
# data_directory, hba_file und ident_file explizit zurück auf das PGDATA-Volume
# zeigen (initdb legt pg_hba.conf / pg_ident.conf dort an).
# ─────────────────────────────────────────────────────────────────────────────

data_directory = '/var/lib/postgresql/data'
hba_file       = '/var/lib/postgresql/data/pg_hba.conf'
ident_file     = '/var/lib/postgresql/data/pg_ident.conf'

# Damit backend + walg-backup-Container die DB über das Docker-Netz erreichen.
listen_addresses = '*'

# ─── WAL-Archivierung (Voraussetzung für Delta-Backups) ──────────────────────
# archive_command wird vom Postgres-Serverprozess ausgeführt und erbt dessen
# Environment → die WALG_* / AWS_* Variablen (in compose via x-walg-env) sind verfügbar.
wal_level = replica
archive_mode = on
archive_command = 'wal-g wal-push %p'

# Erzwingt mindestens alle 60s eine WAL-Rotation, auch bei wenig Schreiblast,
# damit die Archiv-Kette für PITR lückenlos bleibt.
archive_timeout = 60s

# Etwas mehr WAL-Spielraum für ruhigeren Archiv-Durchsatz.
max_wal_size = 2GB
min_wal_size = 128MB
